<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Leaflet Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #0a192f 0%, #020617 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
        }

        h2 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .link-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #0284c7;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Leaflet List */
        .leaflet-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #020617;
            border: 1px solid #1e293b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            gap: 12px;
        }

        .leaflet-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .leaflet-thumb {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #38bdf8;
        }

        .leaflet-name {
            font-weight: bold;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-btn {
            background: rgba(220, 38, 38, 0.2);
            color: #f87171;
            border: 1px solid #dc2626;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #dc2626;
            color: white;
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }

        #dashboardSection {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div class="card" id="loginSection">
        <h2>Admin Portal Login</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username (admin)">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password (1234)">
        </div>
        <button class="btn" onclick="login()">Login</button>
    </div>

    <!-- Admin Dashboard Section -->
    <div class="card" id="dashboardSection">
        <div class="top-nav">
            <a href="index.html" class="link-btn">&#8592; View Main Site</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <h2>Add New Advertising Leaflet</h2>

        <div class="form-group">
            <label>Company / Store Name</label>
            <input type="text" id="companyInput" placeholder="e.g., Daily Mart Khulna">
        </div>

        <div class="form-group">
            <label>Facebook Image Address (Direct Link)</label>
            <input type="url" id="imageInput" placeholder="Paste Facebook image address here...">
            <p class="hint">* Facebook-এ ছবি বড় করে ওপেন করে Right Click -> "Copy image address" দিয়ে লিংকটি এখানে পেস্ট করুন।</p>
        </div>

        <button class="btn" onclick="addLeaflet()">+ Add Leaflet to Main Portal</button>

        <hr style="border-color: #1e293b; margin: 25px 0;">

        <h2>Uploaded Leaflets (<span id="count">0</span>)</h2>
        <div id="leafletList"></div>
    </div>

    <script>
        // Admin Credentials
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "1234";

        // Check login state
        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
            showDashboard();
        }

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                showDashboard();
            } else {
                alert("ভুল Username অথবা Password! (Default: admin / 1234)");
            }
        }

        function logout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            renderList();
        }

        function addLeaflet() {
            const company = document.getElementById('companyInput').value.trim();
            const image = document.getElementById('imageInput').value.trim();

            if (!company || !image) {
                alert("অনুগ্রহ করে কোম্পানির নাম এবং ছবির লিংক দুটিই দিন!");
                return;
            }

            const savedData = localStorage.getItem('adLeaflets');
            const leaflets = savedData ? JSON.parse(savedData) : [];

            leaflets.push({ company, image });
            localStorage.setItem('adLeaflets', JSON.stringify(leaflets));

            document.getElementById('companyInput').value = '';
            document.getElementById('imageInput').value = '';
            renderList();
            alert("লিফলেট সফলভাবে যুক্ত হয়েছে!");
        }

        function deleteLeaflet(index) {
            if (!confirm("আপনি কি এই লিফলেটটি ডিলিট করতে চান?")) return;

            const savedData = localStorage.getItem('adLeaflets');
            const leaflets = savedData ? JSON.parse(savedData) : [];

            leaflets.splice(index, 1);
            localStorage.setItem('adLeaflets', JSON.stringify(leaflets));
            renderList();
        }

        function renderList() {
            const savedData = localStorage.getItem('adLeaflets');
            const leaflets = savedData ? JSON.parse(savedData) : [];
            const listContainer = document.getElementById('leafletList');
            document.getElementById('count').textContent = leaflets.length;

            if (leaflets.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#64748b;">এখনো কোনো লিফলেট অ্যাড করা হয়নি।</p>';
                return;
            }

            listContainer.innerHTML = '';
            leaflets.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'leaflet-item';
                div.innerHTML = `
                    <div class="leaflet-info">
                        <img src="${item.image}" class="leaflet-thumb" onerror="this.src='https://via.placeholder.com/60/0f172a/38bdf8?text=Err'">
                        <div>
                            <div class="leaflet-name">${item.company}</div>
                            <div style="font-size:11px; color:#64748b;">Slide #${index + 1}</div>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteLeaflet(${index})">Delete</button>
                `;
                listContainer.appendChild(div);
            });
        }
    </script>
</body>
</html>
