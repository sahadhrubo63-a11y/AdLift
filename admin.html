<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdLift - Admin Portal</title>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050811;
            --card-bg: #0c1326;
            --primary-blue: #007bff;
            --neon-blue: #00d2ff;
            --text-light: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #0f1c3f 0%, var(--bg-dark) 80%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        .admin-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .admin-card h2, .admin-card h3 {
            color: var(--neon-blue);
            margin-bottom: 15px;
            font-size: 1.15rem;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: #060a16;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #fff;
            font-size: 0.92rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--neon-blue);
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary-blue), #0056b3);
            color: #fff;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 0.98rem;
        }

        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            padding: 18px;
            border-radius: 12px;
            width: fit-content;
            margin: 15px auto;
        }

        .qr-caption {
            color: #000;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .leaflet-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .leaflet-item {
            background: #060a16;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }

        .leaflet-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
        }

        .leaflet-item p {
            font-size: 0.8rem;
            margin: 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            width: 100%;
        }

        .status-msg {
            font-size: 0.85rem;
            color: #38bdf8;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Box -->
        <div class="admin-card" id="loginBox">
            <h2><i class="fas fa-lock"></i> Admin Portal Login</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" class="form-control" placeholder="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" class="form-control" placeholder="1234">
            </div>
            <button class="btn-primary" onclick="handleLogin()">Login</button>
        </div>

        <!-- Dashboard Box -->
        <div id="dashboardBox" style="display: none;">
            <div class="admin-card">
                <h3><i class="fas fa-cloud-upload-alt"></i> Upload & Publish Leaflets</h3>
                <div class="form-group">
                    <label>Company / Store Name</label>
                    <input type="text" id="companyInput" class="form-control" placeholder="e.g. AdLift / Daily Mart">
                </div>
                <div class="form-group">
                    <label>Select Leaflet Images</label>
                    <input type="file" id="leafletFiles" class="form-control" accept="image/*" multiple>
                </div>
                <button class="btn-primary" id="uploadBtn" onclick="uploadAndSync()">Upload & Publish Live</button>
                <div class="status-msg" id="syncStatus"></div>
            </div>

            <div class="admin-card" style="text-align: center;">
                <h3><i class="fas fa-qrcode"></i> Main Portal QR Code</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">
                    এই QR কোডটি প্রিন্ট করে যেখানে খুশি লাগাতে পারেন।
                </p>
                <div class="form-group">
                    <input type="text" id="qrUrlInput" class="form-control" value="https://sahadhrubo63-a11y.github.io/AdLift/">
                </div>
                <button class="btn-primary" onclick="generateFastQR()" style="margin-bottom: 10px;">Refresh QR Code</button>
                
                <div class="qr-wrapper">
                    <div id="qrcode"></div>
                    <div class="qr-caption">SCAN FOR OFFERS</div>
                </div>
                <button class="btn-primary" onclick="downloadQR()" style="margin-top: 8px; background: #334155;">
                    <i class="fas fa-download"></i> Download QR Image
                </button>
            </div>

            <div class="admin-card">
                <h3><i class="fas fa-images"></i> Active Live Leaflets (<span id="totalCount">0</span>)</h3>
                <div class="leaflet-list" id="adminLeafletList"></div>
                <button class="delete-btn" onclick="clearAllLeaflets()" style="margin-top: 15px; padding: 8px;">Delete All & Sync</button>
            </div>

            <button class="btn-primary" onclick="logoutAdmin()" style="background: #334155; margin-top: 10px;">Logout</button>
        </div>
    </div>

    <script>
        const ADMIN_CREDENTIALS = { username: "admin", password: "1234" };
        const GITHUB_USER = "sahadhrubo63-a11y";
        const GITHUB_REPO = "AdLift"; // যে রিপোজিটরিতে মেইন সাইট লাইভ আছে
        const DATA_FILE = "leaflets.json";
        const GITHUB_TOKEN = "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"; // আপনার দেওয়া টোকেন

        let leaflets = [];

        window.onload = async function () {
            generateFastQR();
            await fetchExistingLeaflets();
        };

        function handleLogin() {
            const user = document.getElementById("adminUser").value.trim();
            const pass = document.getElementById("adminPass").value.trim();

            if (user === ADMIN_CREDENTIALS.username && pass === ADMIN_CREDENTIALS.password) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("dashboardBox").style.display = "block";
                renderAdminList();
            } else {
                alert("Incorrect username or password!");
            }
        }

        function logoutAdmin() {
            document.getElementById("loginBox").style.display = "block";
            document.getElementById("dashboardBox").style.display = "none";
            document.getElementById("adminUser").value = "";
            document.getElementById("adminPass").value = "";
        }

        async function fetchExistingLeaflets() {
            try {
                const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${DATA_FILE}?t=${Date.now()}`;
                const res = await fetch(rawUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        leaflets = data;
                        renderAdminList();
                    }
                }
            } catch (e) {
                console.log("No existing leaflets found.");
            }
        }

        function uploadAndSync() {
            const company = document.getElementById("companyInput").value.trim() || "AdLift Store";
            const files = document.getElementById("leafletFiles").files;

            if (files.length === 0) {
                alert("Please select at least one image.");
                return;
            }

            document.getElementById("syncStatus").innerText = "Processing & uploading to GitHub...";
            document.getElementById("uploadBtn").disabled = true;

            let processed = 0;
            Array.from(files).forEach((file) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    compressImage(e.target.result, 700, 0.72, async (compressedDataUrl) => {
                        leaflets.push({
                            id: Date.now() + Math.random(),
                            company: company,
                            image: compressedDataUrl
                        });
                        processed++;
                        if (processed === files.length) {
                            renderAdminList();
                            await pushToGitHub(GITHUB_TOKEN);
                            document.getElementById("uploadBtn").disabled = false;
                            document.getElementById("leafletFiles").value = "";
                            document.getElementById("companyInput").value = "";
                        }
                    });
                };
                reader.readAsDataURL(file);
            });
        }

        async function pushToGitHub(token) {
            const statusEl = document.getElementById("syncStatus");
            statusEl.innerText = "Syncing with Main Portal...";

            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DATA_FILE}`;
            let sha = null;

            try {
                const getRes = await fetch(apiUrl, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }
            } catch (e) {}

            const jsonString = JSON.stringify(leaflets);
            const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const body = {
                message: "Update leaflets from Admin Portal",
                content: encodedContent
            };
            if (sha) body.sha = sha;

            try {
                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });

                if (putRes.ok) {
                    statusEl.innerText = "✅ Success! মেইন পোর্টালে আপডেট হয়ে গেছে।";
                } else {
                    const err = await putRes.json();
                    statusEl.innerText = "❌ Error: " + (err.message || "Token error");
                }
            } catch (e) {
                statusEl.innerText = "❌ Network error.";
            }
        }

        function compressImage(base64, maxWidth, quality, callback) {
            const img = new Image();
            img.src = base64;
            img.onload = function () {
                const canvas = document.createElement("canvas");
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL("image/jpeg", quality));
            };
        }

        function renderAdminList() {
            const list = document.getElementById("adminLeafletList");
            document.getElementById("totalCount").innerText = leaflets.length;
            list.innerHTML = "";

            leaflets.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "leaflet-item";
                div.innerHTML = `
                    <img src="${item.image}" alt="leaflet">
                    <p>${item.company}</p>
                    <button class="delete-btn" onclick="deleteLeaflet(${index})">Delete</button>
                `;
                list.appendChild(div);
            });
        }

        async function deleteLeaflet(index) {
            leaflets.splice(index, 1);
            renderAdminList();
            await pushToGitHub(GITHUB_TOKEN);
        }

        async function clearAllLeaflets() {
            if (confirm("Delete all leaflets?")) {
                leaflets = [];
                renderAdminList();
                await pushToGitHub(GITHUB_TOKEN);
            }
        }

        function generateFastQR() {
            const qrContainer = document.getElementById("qrcode");
            const url = document.getElementById("qrUrlInput").value.trim();
            qrContainer.innerHTML = "";

            new QRCode(qrContainer, {
                text: url,
                width: 220,
                height: 220,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });
        }

        function downloadQR() {
            const qrCanvas = document.querySelector("#qrcode canvas");
            if (!qrCanvas) return;
            const link = document.createElement("a");
            link.download = "Main-Portal-QR.png";
            link.href = qrCanvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
