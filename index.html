<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdLift - Digital Leaflet Showcase</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050811;
            --card-bg: #0c1326;
            --primary-blue: #007bff;
            --neon-blue: #00d2ff;
            --text-light: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #0f1c3f 0%, var(--bg-dark) 80%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }

        #viewerSection {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .company-header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
        }

        .company-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .slide-counter {
            font-size: 0.85rem;
            color: var(--neon-blue);
            margin-top: 4px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 123, 255, 0.2);
            touch-action: pan-y;
        }

        .slides-track {
            display: flex;
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
        }

        .slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .slide img {
            width: 100%;
            max-height: 62vh;
            object-fit: contain;
            display: block;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(5, 8, 17, 0.75);
            color: var(--neon-blue);
            border: 1px solid rgba(0, 210, 255, 0.4);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            z-index: 10;
            transition: 0.2s;
        }

        .nav-arrow:hover {
            background: var(--primary-blue);
            color: #fff;
        }

        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 14px 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #334155;
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active {
            background: var(--neon-blue);
            width: 22px;
            border-radius: 4px;
        }

        .whatsapp-btn {
            width: 100%;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: #fff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <main id="viewerSection">
        <div class="company-header">
            <div class="company-name" id="displayCompanyName">Loading Leaflets...</div>
            <div class="slide-counter" id="slideCounter">0 / 0</div>
        </div>

        <div class="slider-container" id="sliderContainer">
            <button class="nav-arrow prev-btn" onclick="prevSlide()"><i class="fas fa-chevron-left"></i></button>
            <div class="slides-track" id="slidesTrack"></div>
            <button class="nav-arrow next-btn" onclick="nextSlide()"><i class="fas fa-chevron-right"></i></button>
        </div>

        <div class="dots-container" id="dotsContainer"></div>

        <a href="https://wa.me/8801407193581?text=Hello!%20I%20scanned%20your%20QR%20code." 
           target="_blank" 
           class="whatsapp-btn" 
           id="whatsappLink">
            <i class="fab fa-whatsapp"></i> Chat on WhatsApp (+8801407193581)
        </a>
    </main>

    <script>
        const GITHUB_USER = "sahadhrubo63-a11y";
        const GITHUB_REPO = "AdLift"; // মেইন পোর্টালের রিপোজিটরি নাম
        const DATA_FILE = "leaflets.json";
        const WHATSAPP_NUMBER = "8801407193581";

        let leaflets = [];
        let currentIndex = 0;

        window.onload = async function () {
            await fetchGlobalLeaflets();
            setupTouchSwipe();
        };

        async function fetchGlobalLeaflets() {
            try {
                const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${DATA_FILE}?t=${Date.now()}`;
                const res = await fetch(rawUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        leaflets = data;
                        renderSlider();
                        return;
                    }
                }
            } catch (e) {
                console.log("Error fetching data");
            }

            leaflets = [];
            renderSlider();
        }

        function renderSlider() {
            const track = document.getElementById("slidesTrack");
            const dotsContainer = document.getElementById("dotsContainer");
            const companyTitle = document.getElementById("displayCompanyName");
            const counter = document.getElementById("slideCounter");

            track.innerHTML = "";
            dotsContainer.innerHTML = "";

            if (leaflets.length === 0) {
                track.innerHTML = `<div class="slide"><div class="empty-state">No leaflets published yet.</div></div>`;
                companyTitle.innerText = "AdLift Offer";
                counter.innerText = "0 / 0";
                return;
            }

            if (currentIndex >= leaflets.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = leaflets.length - 1;

            leaflets.forEach((item, index) => {
                const slideDiv = document.createElement("div");
                slideDiv.className = "slide";
                slideDiv.innerHTML = `<img src="${item.image}" alt="${item.company}">`;
                track.appendChild(slideDiv);

                const dot = document.createElement("div");
                dot.className = `dot ${index === currentIndex ? "active" : ""}`;
                dot.onclick = () => goToSlide(index);
                dotsContainer.appendChild(dot);
            });

            updateSliderPosition();
        }

        function updateSliderPosition() {
            const track = document.getElementById("slidesTrack");
            const companyTitle = document.getElementById("displayCompanyName");
            const counter = document.getElementById("slideCounter");
            const dots = document.querySelectorAll(".dot");

            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            const currentItem = leaflets[currentIndex];
            companyTitle.innerText = currentItem.company;
            counter.innerText = `${currentIndex + 1} / ${leaflets.length}`;

            const msg = encodeURIComponent(`Hello! I scanned the QR code for "${currentItem.company}" and want to order/know more.`);
            document.getElementById("whatsappLink").href = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;

            dots.forEach((dot, idx) => {
                dot.classList.toggle("active", idx === currentIndex);
            });
        }

        function nextSlide() {
            if (leaflets.length <= 1) return;
            currentIndex = (currentIndex + 1) % leaflets.length;
            updateSliderPosition();
        }

        function prevSlide() {
            if (leaflets.length <= 1) return;
            currentIndex = (currentIndex - 1 + leaflets.length) % leaflets.length;
            updateSliderPosition();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateSliderPosition();
        }

        function setupTouchSwipe() {
            const slider = document.getElementById("sliderContainer");
            let startX = 0;
            let endX = 0;

            slider.addEventListener("touchstart", (e) => {
                startX = e.touches[0].clientX;
            }, { passive: true });

            slider.addEventListener("touchend", (e) => {
                endX = e.changedTouches[0].clientX;
                const diff = startX - endX;
                if (Math.abs(diff) > 40) {
                    if (diff > 0) nextSlide();
                    else prevSlide();
                }
            }, { passive: true });
        }
    </script>
</body>
</html>
